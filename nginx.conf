server_tokens off;

server {
    listen 80;
    server_name www.espectrolab.ao;
    return 301 https://espectrolab.ao$request_uri;
}

server {
    listen 80;
    server_name espectrolab.ao;
    root /usr/share/nginx/html/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://kgljzugduyqtocdxzcrf.supabase.co; img-src 'self' data: https:; frame-ancestors 'self';" always;

    location = /robots.txt { default_type text/plain; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location /shared/ { alias /usr/share/nginx/html/shared/; add_header Cache-Control "public, max-age=3600"; }
    location / { add_header Cache-Control "public, max-age=300, must-revalidate"; try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name app.espectrolab.ao;
    root /usr/share/nginx/html/app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://kgljzugduyqtocdxzcrf.supabase.co wss://kgljzugduyqtocdxzcrf.supabase.co; img-src 'self' data: blob: https:; frame-ancestors 'self';" always;

    location = /robots.txt { default_type text/plain; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location /shared/ { alias /usr/share/nginx/html/shared/; add_header Cache-Control "public, max-age=3600"; }
    location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ /index.html; }
}
