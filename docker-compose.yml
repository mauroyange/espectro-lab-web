services:
  espectrolab-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80"
    command: >
      sh -c "apk add --no-cache git &&
      rm -rf /tmp/repo &&
      git clone --depth 1 https://github.com/mauroyange/espectro-lab-web.git /tmp/repo &&
      rm -f /etc/nginx/conf.d/default.conf &&
      cp /tmp/repo/nginx.conf /etc/nginx/conf.d/espectrolab.conf &&
      cp -r /tmp/repo/shared /tmp/repo/site /tmp/repo/app /usr/share/nginx/html/ &&
      nginx -g 'daemon off;'"
    labels:
      - traefik.enable=true
      - traefik.http.routers.espectrolab.rule=Host(`espectrolab.ao`) || Host(`www.espectrolab.ao`) || Host(`app.espectrolab.ao`)
      - traefik.http.routers.espectrolab.entrypoints=websecure
      - traefik.http.routers.espectrolab.tls.certresolver=letsencrypt
      - traefik.http.services.espectrolab.loadbalancer.server.port=80
